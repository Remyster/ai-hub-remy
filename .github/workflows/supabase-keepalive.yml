name: Supabase Keepalive

# Gratis Supabase-projecten worden gepauzeerd na een week zonder activiteit.
# Deze job doet om de twee dagen één kleine REST-query op beide projecten.
# URL en key komen uit het HUB_DB-blok in index.html, zodat een key-rotatie
# hier vanzelf mee gaat.

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: A
            naam: StekkerSlim AI Control
            tabel: pipeline_state
          - db: B
            naam: Vaste Lasten / Hub-data
            tabel: app_settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping ${{ matrix.naam }} (project ${{ matrix.db }})
        run: |
          REGEL=$(grep -oP "^\s*${{ matrix.db }}: \{ url: '[^']+', key: '[^']+'" index.html | head -1)
          SB_URL=$(echo "$REGEL" | grep -oP "url: '\K[^']+")
          SB_KEY=$(echo "$REGEL" | grep -oP "key: '\K[^']+")
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "Kon url/key van project ${{ matrix.db }} niet uit HUB_DB in index.html lezen" >&2
            exit 1
          fi
          echo "::add-mask::$SB_KEY"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/${{ matrix.tabel }}?select=*&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Keepalive ping mislukt met status $STATUS" >&2
            exit 1
          fi
