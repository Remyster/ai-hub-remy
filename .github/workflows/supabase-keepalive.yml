name: Supabase Keepalive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping StekkerSlim AI Control (project A) REST API
        run: |
          SB_URL=$(grep -oP "const SS_SBURL = '\K[^']+" index.html)
          SB_KEY=$(grep -oP "const SS_SBKEY = '\K[^']+" index.html)
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "Kon SS_SBURL/SS_SBKEY niet uit index.html lezen" >&2
            exit 1
          fi
          echo "::add-mask::$SB_KEY"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/pipeline_state?select=key&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Keepalive ping failed with status $STATUS"
            exit 1
          fi
